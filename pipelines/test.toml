source_dir = "/tmp/stuffie_test/input"

[[stages]]
name = "preprocess"
cmd = "./bin/preprocess"
args = ["--input", "/tmp/input", "--output", "/tmp/output"]
qa = false

[[stages]]
name = "transform"
cmd = "./bin/transform"
qa = true